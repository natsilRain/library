<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library | Home</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="content">
        <div class="header">
            <h1>Rain's Library</h1>
            <button type="button" command="show-modal" commandfor="new-book">+</button>
        </div>
        <div class="libraryDisplay">

        </div>
    </div>
    <dialog id="new-book" class="new-book-dialog">
        <form action="" method="">
            <div class="new-book-header">
                <h2>New Book</h2>
                <div>
                    <button type="button" class="newBookBtn">Ok</button>
                    <button type="button" commandfor="new-book" command="close">X</button>
                </div>
            </div>
            <label for="title">Title:</label>
            <input type="text" id="title" name="bookTitle" class="bookTitle" />

            <label for="author">Author:</label>
            <input type="text" id="author" name="bookAuthor" class="bookAuthor" />

            <label for="pages">Page Count:</label>
            <input type="number" id="pages" name="bookPages" class="bookPages" />

            <fieldset>
                <legend>Book Status</legend>
                <div>
                    <input type="radio" id="read" name="status" value="read" class="bookStatus" />
                    <label for="read">Read</label>
                </div>

                <div>
                    <input type="radio" id="unread" name="status" value="read" class="bookStatus" />
                    <label for="unread">Unread</label>
                </div>

                <div>
                    <input type="radio" id="reading" name="status" value="read" class="bookStatus" />
                    <label for="reading">Reading</label>
                </div>
            </fieldset>
        </form>
    </dialog>
    <script src="index.js"></script>
</body>
</html>
